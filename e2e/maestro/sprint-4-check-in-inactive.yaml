appId: mx.com.gymbox.mobile
name: Sprint 4 - check-in BLOCKED_INACTIVE_STUDENT
tags: [sprint-4, attendance, check-in, external-fixture]
---
- runFlow: _sprint-4-login-instructor.yaml
- runFlow:
    file: _sprint-4-find-student.yaml
    env:
      ATTENDANCE_SEARCH: "${GYMBOX_E2E_ATTENDANCE_INACTIVE_SEARCH}"
      ATTENDANCE_RESULT: "${GYMBOX_E2E_ATTENDANCE_INACTIVE_RESULT}"
- tapOn: "Registrar check-in"
- tapOn: "Revisar check-in"
- tapOn: "Registrar check-in ahora"
- assertVisible: "Check-in bloqueado"
- assertVisible: "El alumno está inactivo. No se registró asistencia."
- assertNotVisible: "Registrar pago"
