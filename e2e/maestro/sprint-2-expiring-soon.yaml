appId: mx.com.gymbox.mobile
name: Sprint 2 - membresía próxima a vencer
tags:
  - sprint-2
  - memberships
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Correo electrónico"
- inputText: "${GYMBOX_E2E_EMAIL}"
- tapOn: "Contraseña"
- inputText: "${GYMBOX_E2E_PASSWORD}"
- hideKeyboard
- tapOn: "Iniciar sesión"
- tapOn: "Buscar alumnos"
- tapOn: "Nombre o teléfono"
- inputText: "${GYMBOX_E2E_EXPIRING_SOON_SEARCH}"
- tapOn: "${GYMBOX_E2E_EXPIRING_SOON_RESULT}"
- assertVisible: "Próxima a vencer"
- assertVisible: "Vence en 5 días"
