appId: mx.com.gymbox.mobile
name: Sprint 4 - check-in ALREADY_REGISTERED
tags: [sprint-4, attendance, check-in, external-fixture]
---
- runFlow: _sprint-4-login-instructor.yaml
- runFlow:
    file: _sprint-4-find-student.yaml
    env:
      ATTENDANCE_SEARCH: "${GYMBOX_E2E_ATTENDANCE_ALREADY_SEARCH}"
      ATTENDANCE_RESULT: "${GYMBOX_E2E_ATTENDANCE_ALREADY_RESULT}"
- tapOn: "Registrar check-in"
- tapOn: "Revisar check-in"
- tapOn: "Registrar check-in ahora"
- assertVisible: "Asistencia ya registrada"
- assertVisible: "No se creó otro."
- assertNotVisible: "Check-in registrado"
