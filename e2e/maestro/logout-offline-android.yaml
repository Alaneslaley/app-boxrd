appId: mx.com.gymbox.mobile
name: Sprint 1 - logout local sin red Android
tags:
  - android
  - auth
  - offline
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Correo electrónico"
- inputText: "${GYMBOX_E2E_EMAIL}"
- tapOn: "Contraseña"
- inputText: "${GYMBOX_E2E_PASSWORD}"
- hideKeyboard
- tapOn: "Iniciar sesión"
- assertVisible: "Sesión autenticada"
- setAirplaneMode: enabled
- tapOn: "Cerrar sesión"
- assertVisible: "GymBox"
- assertVisible: "Sin conexión"
- pressKey: BACK
- assertNotVisible: "Sesión autenticada"
- setAirplaneMode: disabled
