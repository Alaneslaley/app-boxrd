name: Mobile quality

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Verify OpenAPI contract
        run: npm run verify:contract

      - name: Verify generated OpenAPI types from temporary output
        run: npm run verify:generated

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      - name: Verify import boundaries
        run: npm run verify:boundaries

      - name: Detect dependency cycles
        run: npm run verify:cycles

      - name: Validate environments
        run: npm run validate:environments

      - name: Expo Doctor
        run: npm run doctor

      - name: Validate Maestro YAML
        run: npm run validate:maestro

      - name: Export Android bundle
        run: npm run export
